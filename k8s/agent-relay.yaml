# Agent Relay API and dashboard. The image is built locally and loaded into
# kind (see k8s/README.md), so it is never pulled from a registry.
apiVersion: v1
kind: Service
metadata:
  name: agent-relay
  labels:
    app.kubernetes.io/name: agent-relay
spec:
  selector:
    app.kubernetes.io/name: agent-relay
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
  labels:
    app.kubernetes.io/name: agent-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      # The app creates its schema on startup, so wait for PostgreSQL first
      # rather than crash-looping until it accepts connections.
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          # -U is required: UID 10001 has no passwd entry, so libpq cannot
          # infer a user name and pg_isready reports "no attempt" forever.
          command: ["sh", "-c", 'until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do echo waiting for postgres; sleep 2; done']
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: agent-relay-db, key: POSTGRES_USER}}
      containers:
        - name: agent-relay
          image: agent-relay:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RELAY_DATABASE_URL
              valueFrom: {secretKeyRef: {name: agent-relay-db, key: RELAY_DATABASE_URL}}
            - name: RELAY_ENROLLMENT_SECRET
              valueFrom: {secretKeyRef: {name: agent-relay-enrollment, key: RELAY_ENROLLMENT_SECRET}}
          # /ready checks database connectivity and schema, so the pod only
          # receives traffic once PostgreSQL is reachable and initialized.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
