# Agent Relay + PostgreSQL for local development.
#   docker compose up -d --build
# API and dashboard: http://127.0.0.1:8000/
#
# Both ports are published on 127.0.0.1 only. PostgreSQL is published so the
# test suite on the host can reach it (it uses a separate agent_relay_test DB).
# Set POSTGRES_PASSWORD (e.g. in a .env file) for anything beyond local use.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_relay}
      POSTGRES_DB: agent_relay
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_relay -d agent_relay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent-relay:
    build: .
    image: agent-relay:local
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:${POSTGRES_PASSWORD:-agent_relay}@postgres:5432/agent_relay
      RELAY_ENROLLMENT_SECRET: ${RELAY_ENROLLMENT_SECRET:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
